<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>줄넘기</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #1a1a1a;
    }

    /* ============================
          무대
============================ */

    .scene {
      perspective: 1200px;
    }

    .rope-container {
      position: relative;
      width: 400px;
      height: 260px;
    }

    /* ============================
          손잡이
============================ */

    .handle {
      position: absolute;
      top: 12px;
      width: 34px;
      height: 14px;
      border-radius: 4px;
      z-index: 20;

      background: linear-gradient(to bottom,
          #d9a26b,
          #9c6539);

      border: 1px solid #6e4322;

      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, .35),
        0 2px 4px rgba(0, 0, 0, .3);
    }

    .handle.left {
      left: 4px;
      transform: rotate(-12deg);
    }

    .handle.right {
      right: 4px;
      transform: rotate(12deg);
    }

    /* ============================
           줄
============================ */

    .rope-svg {
      width: 100%;
      height: 100%;
      overflow: visible;

      transform-origin: 50% 0%;
      transform-style: preserve-3d;

      animation:
        rope-spin 1.1s linear infinite;
    }

    @keyframes rope-spin {

      0% {
        transform: rotateX(0deg);
        opacity: 1;
        filter: drop-shadow(0 10px 8px rgba(0, 0, 0, .35));
      }

      25% {
        transform: rotateX(90deg);
        opacity: .75;
      }

      50% {
        transform: rotateX(180deg);
        opacity: .25;
        filter: none;
      }

      75% {
        transform: rotateX(270deg);
        opacity: .75;
      }

      100% {
        transform: rotateX(360deg);
        opacity: 1;
        filter: drop-shadow(0 10px 8px rgba(0, 0, 0, .35));
      }
    }
  </style>
</head>

<body>

  <div class="scene">

    <div class="rope-container">

      <div class="handle left"></div>
      <div class="handle right"></div>

      <svg class="rope-svg" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg">

        <defs>

          <!-- 밧줄 색 -->

          <linearGradient id="ropeColor" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#c8955f" />
            <stop offset="50%" stop-color="#9d6b3e" />
            <stop offset="100%" stop-color="#754720" />
          </linearGradient>

        </defs>

        <!-- 외곽 -->

        <path d="M 20,20 Q 200,260 380,20" fill="none" stroke="#5b3518" stroke-width="16" stroke-linecap="round" />

        <!-- 몸통 -->

        <path d="M 20,20 Q 200,260 380,20" fill="none" stroke="url(#ropeColor)" stroke-width="12"
          stroke-linecap="round" />

        <!-- 꼬임 표현 -->

        <path d="M 20,20 Q 200,260 380,20" fill="none" stroke="#e7c79e" stroke-width="3" stroke-linecap="round"
          stroke-dasharray="2 10" />

      </svg>

    </div>

  </div>

</body>

</html>
